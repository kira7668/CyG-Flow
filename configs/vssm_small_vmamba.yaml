# CyG-Flow: VMamba vssm_small + normalizing flow (Glow 1x1 + CRF-B subnets + stable_tanh RealNVP)
# Entry: main_vmamba.py
# Weights (download, not in repo): vim_small_midclstok/vssm_small_0229_ckpt_epoch_222.pth
#   https://github.com/MzeroMiko/VMamba/releases/download/%23v2cls/vssm_small_0229_ckpt_epoch_222.pth
# CRF-B receptive-field cycle: 1x1 -> 3x3 -> 5x5 (5x5 implemented as two stacked 3x3)
input_size: 256
backbone_name: vssm_small
flow_step: 8
hidden_ratio: 1.0
conv3x3_only: false

saf:
  enabled: false

multi_scale:
  fusion_learnable: true
  fusion_init: [0.2, 0.3, 0.5]

flow_subnet_type: crf-bnets
flow_kernel_alternating: false

flow_coupling_type: stable_tanh_realnvp
flow_coupling_eps: 0.002
flow_coupling_alpha: 0.02
flow_coupling_gamma: 1.0

eval:
  image_score:
    mode: gfn_mix
    topk_ratio: 0.01
    quantile: 0.99
    quantile_high: 0.999
    gfn_temperature: 0.08
    gfn_prior: [-0.1, 0.8, -0.2, -0.1]
    use_raw_map: true
  anomaly_post:
    map_norm: none
